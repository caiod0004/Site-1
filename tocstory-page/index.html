<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TocStory · Website under maintenance</title>
<meta name="description" content="The TocStory website is under maintenance. We'll be back soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root{--lime:#d8eb4f;--ink:#3a332c;--taupe:#857a6f}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{min-height:100%;display:grid;place-items:center;padding:2rem;background:#fbfbf6;color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:30rem}
  img{width:min(62vw,15rem);height:auto}
  h1{margin-top:2.4rem;font-size:clamp(1.5rem,1.2rem+1.4vw,2.1rem);font-weight:700;letter-spacing:-.01em}
  p{margin-top:.9rem;color:var(--taupe);font-size:1.05rem;line-height:1.6}
  .bar{width:4.5rem;height:.35rem;border-radius:1rem;background:var(--lime);margin:1.8rem auto 0}
</style>
</head>
<body>
<main>
  <img src="/tocstory-logo.webp" alt="TocStory – il nostro tocco magico" width="640" height="885">
  <h1>Website under maintenance</h1>
  <p>We're building something new. Please check back soon.</p>
  <div class="bar" aria-hidden="true"></div>
</main>
</body>
</html>
